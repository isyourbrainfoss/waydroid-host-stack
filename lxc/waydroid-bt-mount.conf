# Waydroid LXC fragment: expose host bridge socket directory to the guest.
#
# Host:  /run/waydroid-bt/host.sock  (waydroid-bt-host.service)
# Guest: /run/waydroid-bt/host.sock  (and optional symlink /dev/socket/waydroid_bt)
#
# Prefer mounting the *directory* (rbind). Binding a single socket file with
# create=file is flaky on some LXC/kernel combos.
#
# Apply by appending to:
#   /var/lib/waydroid/lxc/waydroid/config_nodes
# Then: waydroid session stop; sudo systemctl restart waydroid-container; waydroid session start
#
# Alternative if LXC mount fails: after session is RUNNING run
#   sudo /usr/local/sbin/waydroid-bt-inject-socket.sh

lxc.mount.entry = /run/waydroid-bt run/waydroid-bt none rbind,create=dir,optional 0 0
