# Waydroid LXC fragment: expose the host bridge socket directory to the guest.
#
# Host:  /run/waydroid-bt/host.sock   (waydroid-bt-host.service)
# Guest: /run/waydroid-bt/host.sock   (same path; directory rbind)
#        /dev/socket/waydroid_bt      optional convenience symlink created by
#                                     waydroid-bt-inject-socket.sh / HAL init
#
# Mount the *directory* (rbind). Binding a single socket file with create=file
# is flaky on some LXC/kernel combos.
#
# Installed to /etc/waydroid-bt/lxc-mount.conf and referenced from the END of
# /var/lib/waydroid/lxc/waydroid/config via
#   lxc.include = /etc/waydroid-bt/lxc-mount.conf
# by scripts/waydroid-bt-apply-lxc-include.sh (re-applied automatically before
# each container start and whenever Waydroid rewrites its config).
# Fallback when the container is already running: waydroid-bt-inject.service.

lxc.mount.entry = /run/waydroid-bt run/waydroid-bt none rbind,create=dir,optional 0 0
