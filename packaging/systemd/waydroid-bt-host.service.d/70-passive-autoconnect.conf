# Passive LE auto-connect for absent peers (Tesla phone key, FP5): the bridge
# arms the kernel LE auto-connect list over the mgmt control socket
# (AF_BLUETOOTH, CAP_NET_ADMIN as root). Drop-in for units installed before
# this change; new installs get it from host/systemd/waydroid-bt-host.service.
# Without it the bridge answers UNSUPPORTED and the guest HAL keeps the old
# active retries.
[Service]
RestrictAddressFamilies=AF_UNIX AF_BLUETOOTH
