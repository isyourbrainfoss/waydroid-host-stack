# Installed by waydroid-host-stack. Make sure the bridge socket directory and
# the lxc.include line exist before every container start (covers upgrades and
# `waydroid init` that rewrite /var/lib/waydroid/lxc/waydroid/config).
[Unit]
Wants=waydroid-bt-host.service
After=waydroid-bt-host.service

[Service]
ExecStartPre=-mkdir -p /run/waydroid-bt
ExecStartPre=-@SBINDIR@/waydroid-bt-apply-lxc-include.sh
