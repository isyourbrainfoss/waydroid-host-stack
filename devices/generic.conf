# shellcheck shell=sh
# shellcheck disable=SC2034
# Generic Linux phone defaults. Copy to devices/<codename>.conf and adjust.
DEVICE_NAME="generic"
# Space-separated firmware files that must exist for the BT controller.
BT_FIRMWARE=""
# Kernel driver expected to own the HCI (informational).
BT_DRIVER=""
# 1 if the kernel exposes an NFC controller (nfc0) worth probing with neard.
NFC_EXPECTED=0
# 1 if the bootloader cmdline carries androidboot.mode=charger that Android
# init would pick up (needs waydroid-force-normal-boot overlay).
HALF_BOOT_FIX=0
# Host package manager for setup-pmos.sh: apk | none (immutable image).
PKG_MANAGER=auto
