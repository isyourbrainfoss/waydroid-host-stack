# shellcheck shell=sh
# shellcheck disable=SC2034
# OnePlus 6 (enchilada) — SDM845 / WCN3990, NXP NCI NFC (nxp_nci_i2c).
# Verified 2026-10 on Nura edge "Duranium" (image-based, sysext/confext),
# kernel 7.1 sdm845, BlueZ 5.87, Waydroid 1.6.3 + Lineage 20 VANILLA (TQ3A).
DEVICE_NAME="OnePlus 6"
BT_FIRMWARE="/lib/firmware/postmarketos/qca/crbtfw21.tlv /lib/firmware/qca/OnePlus/enchilada/crnv21.bin"
BT_DRIVER="hci_uart_qca"
NFC_EXPECTED=1
# Duranium's /proc/cmdline does not carry androidboot.mode; only enable the
# overlay if Waydroid half-boots (session RUNNING, IP UNKNOWN).
HALF_BOOT_FIX=0
PKG_MANAGER=auto
