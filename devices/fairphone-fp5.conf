# shellcheck shell=sh
# shellcheck disable=SC2034
# Fairphone 5 (fairphone,fp5) — Qualcomm QCM6490 (sc7280), WCN6750 Wi-Fi/BT.
# Verified 2026-11 on BengalOS (image-based: read-only /usr, systemd-sysext),
# Waydroid 1.6.3 + Lineage 20 VANILLA (TQ3A.230901.001), Phosh.
#
# Detected from the device tree (BengalOS sets IMAGE_ID=BengalOS, so
# lib/device.sh falls through to /proc/device-tree/compatible).
#
# Bluetooth: WCN6750 over hci_uart_qca; BlueZ owns hci0 and waydroid-bt-host
#   shares it (Soft HCI), never pass the controller to the container.
# Location: GNSS comes from ModemManager (mmcli --location-enable-gps-nmea)
#   through GeoClue; waydroid-geoclue-fix + waydroid-gps-inject forward it.
# Waydroid images live in /home/waydroid/images (images_path in
#   /var/lib/waydroid/waydroid.cfg; scripts read it from there).
DEVICE_NAME="Fairphone 5"
# Firmware is qca/msbtfw11.mbn + qca/msnv11.bin; distros may ship it
# compressed (.zst/.xz), which the plain existence check would flag, so it is
# not listed here.
BT_FIRMWARE=""
BT_DRIVER="hci_uart_qca"
# ST21NFCD has no mainline NFC driver yet: no nfc0 to probe.
NFC_EXPECTED=0
# Waydroid boots normally (no androidboot.mode=charger on the cmdline).
HALF_BOOT_FIX=0
# Image-based: no host package manager.
PKG_MANAGER=none
