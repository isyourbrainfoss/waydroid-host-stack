[package]
name = "waydroid-bt-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host bridge: Waydroid Bluetooth backend over BlueZ (sole HCI owner)"

[[bin]]
name = "waydroid-bt-host"
path = "src/main.rs"

[[bin]]
name = "waydroid-bt-ping"
path = "src/bin/waydroid-bt-ping.rs"

[[bin]]
name = "waydroid-bt-jni-patch"
path = "src/bin/waydroid-bt-jni-patch.rs"

[dependencies]
waydroid_bt_protocol = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tokio-util = { version = "0.7", features = ["codec"] }
# Only pulled in to switch libdbus-sys to a vendored (static) build for
# cross/static aarch64 musl binaries: `--features vendored-dbus`.
dbus = { version = "0.9", optional = true }

[features]
default = []
vendored-dbus = ["dep:dbus", "dbus/vendored"]

[dev-dependencies]
tempfile = "3"
