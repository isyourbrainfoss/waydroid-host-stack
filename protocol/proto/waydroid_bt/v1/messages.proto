// Waydroid Bluetooth host bridge protocol v1 (LE-first).
// Transport: Unix stream socket, 4-byte little-endian length prefix + protobuf Envelope.

syntax = "proto3";

package waydroid_bt.v1;

// ---------------------------------------------------------------------------
// Framing
// ---------------------------------------------------------------------------

message Envelope {
  uint64 request_id = 1; // 0 for unsolicited events
  oneof body {
    Request request = 2;
    Response response = 3;
    Event event = 4;
  }
}

message Request {
  oneof op {
    PingRequest ping = 1;
    GetAdapterInfoRequest get_adapter_info = 2;
    SetPoweredRequest set_powered = 3;
    StartLeScanRequest start_le_scan = 4;
    StopLeScanRequest stop_le_scan = 5;
    ConnectLeRequest connect_le = 6;
    DisconnectRequest disconnect = 7;
    GattDiscoverRequest gatt_discover = 8;
    GattReadRequest gatt_read = 9;
    GattWriteRequest gatt_write = 10;
    GattSetNotifyRequest gatt_set_notify = 11;
    CreateBondRequest create_bond = 12;
    RemoveBondRequest remove_bond = 13;
    ListBondsRequest list_bonds = 14;
  }
}

message Response {
  ErrorCode error = 1;
  string error_message = 2;
  oneof result {
    PingResponse ping = 10;
    GetAdapterInfoResponse get_adapter_info = 11;
    SetPoweredResponse set_powered = 12;
    StartLeScanResponse start_le_scan = 13;
    StopLeScanResponse stop_le_scan = 14;
    ConnectLeResponse connect_le = 15;
    DisconnectResponse disconnect = 16;
    GattDiscoverResponse gatt_discover = 17;
    GattReadResponse gatt_read = 18;
    GattWriteResponse gatt_write = 19;
    GattSetNotifyResponse gatt_set_notify = 20;
    CreateBondResponse create_bond = 21;
    RemoveBondResponse remove_bond = 22;
    ListBondsResponse list_bonds = 23;
  }
}

message Event {
  oneof payload {
    AdapterStateEvent adapter_state = 1;
    AdvReportEvent adv_report = 2;
    ConnectionStateEvent connection_state = 3;
    GattNotificationEvent gatt_notification = 4;
    BondStateEvent bond_state = 5;
    PairingRequestEvent pairing_request = 6;
  }
}

// ---------------------------------------------------------------------------
// Common types
// ---------------------------------------------------------------------------

enum ErrorCode {
  ERROR_CODE_OK = 0;
  ERROR_CODE_UNKNOWN = 1;
  ERROR_CODE_NOT_READY = 2;
  ERROR_CODE_INVALID_ARGUMENT = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_BUSY = 5;
  ERROR_CODE_PERMISSION_DENIED = 6;
  ERROR_CODE_UNSUPPORTED = 7;
  ERROR_CODE_TIMEOUT = 8;
  ERROR_CODE_BLUEZ = 9;
  ERROR_CODE_DISCONNECTED = 10;
  ERROR_CODE_SOFT_DISABLED = 11; // guest soft-disabled; host radio still up
}

enum AdapterState {
  ADAPTER_STATE_UNKNOWN = 0;
  ADAPTER_STATE_OFF = 1;
  ADAPTER_STATE_TURNING_ON = 2;
  ADAPTER_STATE_ON = 3;
  ADAPTER_STATE_TURNING_OFF = 4;
  ADAPTER_STATE_UNAVAILABLE = 5; // BlueZ down / no controller
}

enum ConnectionState {
  CONNECTION_STATE_DISCONNECTED = 0;
  CONNECTION_STATE_CONNECTING = 1;
  CONNECTION_STATE_CONNECTED = 2;
  CONNECTION_STATE_DISCONNECTING = 3;
}

enum BondState {
  BOND_STATE_NONE = 0;
  BOND_STATE_BONDING = 1;
  BOND_STATE_BONDED = 2;
}

enum AddressType {
  ADDRESS_TYPE_UNKNOWN = 0;
  ADDRESS_TYPE_PUBLIC = 1;
  ADDRESS_TYPE_RANDOM = 2;
}

message BtAddress {
  // Canonical "AA:BB:CC:DD:EE:FF"
  string address = 1;
  AddressType address_type = 2;
}

// ---------------------------------------------------------------------------
// Adapter
// ---------------------------------------------------------------------------

message PingRequest {
  string client_name = 1;
}

message PingResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string host_version = 3;
}

message GetAdapterInfoRequest {}

message GetAdapterInfoResponse {
  AdapterInfo info = 1;
}

message AdapterInfo {
  BtAddress address = 1;
  string name = 2;
  string alias = 3;
  AdapterState state = 4;
  bool powered = 5;
  bool le_supported = 6;
  bool guest_soft_disabled = 7; // Android thinks BT off; host may still be on
  repeated string uuids = 8;
}

message SetPoweredRequest {
  // Guest power request. Host policy: soft-disable by default (does not power
  // off BlueZ). Set force_host=true only for explicit host-level power change.
  bool powered = 1;
  bool force_host = 2;
}

message SetPoweredResponse {
  AdapterInfo info = 1;
}

message AdapterStateEvent {
  AdapterInfo info = 1;
}

// ---------------------------------------------------------------------------
// LE scan
// ---------------------------------------------------------------------------

message StartLeScanRequest {
  // Empty = accept all advertisements.
  repeated string service_uuids = 1;
  // Optional MAC filter (canonical form).
  repeated string addresses = 2;
  bool active = 3; // active scan if true
}

message StartLeScanResponse {
  uint32 session_id = 1;
}

message StopLeScanRequest {
  uint32 session_id = 1;
}

message StopLeScanResponse {}

message AdvReportEvent {
  uint32 session_id = 1;
  BtAddress address = 2;
  int32 rssi = 3;
  string name = 4;
  bool connectable = 5;
  bytes manufacturer_data = 6;
  // service_uuid -> service data bytes
  map<string, bytes> service_data = 7;
  repeated string service_uuids = 8;
  bytes raw_adv = 9;
}

// ---------------------------------------------------------------------------
// Connection
// ---------------------------------------------------------------------------

message ConnectLeRequest {
  BtAddress address = 1;
  uint32 timeout_ms = 2; // 0 = default
}

message ConnectLeResponse {
  string device_id = 1; // host-stable id (usually address)
  uint32 mtu = 2;
}

message DisconnectRequest {
  string device_id = 1;
}

message DisconnectResponse {}

message ConnectionStateEvent {
  string device_id = 1;
  BtAddress address = 2;
  ConnectionState state = 3;
  string reason = 4;
}

// ---------------------------------------------------------------------------
// GATT
// ---------------------------------------------------------------------------

message GattDiscoverRequest {
  string device_id = 1;
}

message GattDiscoverResponse {
  repeated GattService services = 1;
}

message GattService {
  string uuid = 1;
  uint32 handle = 2;
  bool primary = 3;
  repeated GattCharacteristic characteristics = 4;
}

message GattCharacteristic {
  string uuid = 1;
  uint32 handle = 2;
  uint32 properties = 3; // bitfield matching Android BluetoothGattCharacteristic
  repeated GattDescriptor descriptors = 4;
}

message GattDescriptor {
  string uuid = 1;
  uint32 handle = 2;
}

message GattReadRequest {
  string device_id = 1;
  string characteristic_uuid = 2;
  // Optional service scope when uuid is ambiguous.
  string service_uuid = 3;
}

message GattReadResponse {
  bytes value = 1;
}

message GattWriteRequest {
  string device_id = 1;
  string characteristic_uuid = 2;
  string service_uuid = 3;
  bytes value = 4;
  bool without_response = 5;
}

message GattWriteResponse {}

message GattSetNotifyRequest {
  string device_id = 1;
  string characteristic_uuid = 2;
  string service_uuid = 3;
  bool enable = 4;
}

message GattSetNotifyResponse {}

message GattNotificationEvent {
  string device_id = 1;
  string characteristic_uuid = 2;
  string service_uuid = 3;
  bytes value = 4;
}

// ---------------------------------------------------------------------------
// Bonding
// ---------------------------------------------------------------------------

message CreateBondRequest {
  BtAddress address = 1;
}

message CreateBondResponse {
  BondState state = 1;
}

message RemoveBondRequest {
  BtAddress address = 1;
}

message RemoveBondResponse {}

message ListBondsRequest {}

message ListBondsResponse {
  repeated BondedDevice devices = 1;
}

message BondedDevice {
  BtAddress address = 1;
  string name = 2;
  BondState state = 3;
}

message BondStateEvent {
  BtAddress address = 1;
  BondState state = 2;
}

message PairingRequestEvent {
  BtAddress address = 1;
  // passkey display / confirmation; PIN as string when applicable
  string passkey = 2;
  bool enter_pin = 3;
  bool confirm = 4;
}
