[workspace]
resolver = "2"
members = [
    "protocol",
    "host",
    "guest-probe",
]
default-members = ["host"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/waydroid-bluetooth/waydroid-bluetooth"
version = "0.1.0"

[workspace.dependencies]
waydroid_bt_protocol = { path = "protocol" }
bytes = "1"
prost = "0.13"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
